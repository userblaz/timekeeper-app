<title>Timekeeper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14141C;
    --surface:#1E1E2A;
    --surface-2:#262635;
    --ink:#F5F5FA;
    --grey:#9C9AB5;
    --grey-light:#6E6C87;
    --line:#302F42;
    --accent:#7C5CFC;
    --hero-bg:#0A0A10;
    --good:#34D399;
    --bad:#F87171;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  button, label, input, .tab{
    -webkit-text-fill-color:currentColor;
  }
  html,body{margin:0;padding:0;}
  html{
    background:#14141C;
    color-scheme:dark;
  }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .app{
    max-width:480px;
    margin:0 auto;
    padding:max(24px, env(safe-area-inset-top)) 18px calc(80px + env(safe-area-inset-bottom));
    background:var(--bg);
    min-height:100vh;
    min-height:100dvh;
  }
  h1{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:-0.3px;
    margin:0 0 2px;
  }
  .subhead{
    font-size:13px;
    color:var(--grey);
    margin:0 0 20px;
  }

  /* Watch tabs — underline indicator, not pills */
  .tabs{
    display:flex;
    gap:18px;
    flex-wrap:nowrap;
    overflow-x:auto;
    overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    margin-bottom:8px;
    border-bottom:1px solid var(--line);
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    font-family:'Inter',sans-serif;
    font-size:14px;
    font-weight:500;
    padding:0 0 11px;
    border:none;
    border-bottom:2px solid transparent;
    background:transparent;
    color:var(--grey);
    cursor:pointer;
    margin-bottom:-1px;
    flex-shrink:0;
    white-space:nowrap;
  }
  .tab.active{
    color:var(--good);
    border-bottom-color:var(--good);
  }
  .tab.addnew{
    color:var(--accent);
  }

  /* Dial */
  .dial-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:0;
  }
  .dial-figure{
    font-family:'Inter',sans-serif;
    font-size:24px;
    font-weight:600;
    letter-spacing:-0.5px;
    line-height:1;
  }
  .dial-unit{
    font-family:'Inter',sans-serif;
    font-size:11px;
    font-weight:500;
    color:var(--grey);
  }
  .dial-meta{
    margin-top:2px;
    text-align:center;
    font-size:11px;
    color:var(--grey);
    line-height:1.3;
  }
  .empty-dial{
    font-family:'Inter',sans-serif;
    font-size:14px;
    color:var(--grey);
    text-align:center;
    padding:26px 10px 6px;
  }

  /* Chart */
  .chart-box{
    margin:22px 0 4px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:20px;
    padding:16px 16px 8px;
    box-shadow:0 8px 24px -8px rgba(0,0,0,0.5);
  }
  .chart-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
    gap:8px;
  }
  .chart-label{
    font-size:11.5px;
    color:var(--grey);
  }
  .chart-zoom{
    display:flex;
    gap:4px;
    flex-shrink:0;
  }
  .tg-sens-slider{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    height:4px;
    border-radius:2px;
    background:var(--line);
    accent-color:var(--accent);
    outline:none;
  }
  .tg-sens-slider::-webkit-slider-thumb{
    -webkit-appearance:none;
    appearance:none;
    width:18px;
    height:18px;
    border-radius:50%;
    background:var(--accent);
    border:2px solid #fff;
    cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,0.4);
  }
  .tg-sens-slider::-moz-range-thumb{
    width:18px;
    height:18px;
    border-radius:50%;
    background:var(--accent);
    border:2px solid #fff;
    cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,0.4);
  }
  .zoom-btn{
    width:30px;
    height:30px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--surface-2);
    color:var(--ink);
    font-size:17px;
    font-weight:600;
    line-height:1;
    padding:0;
    display:flex;

<script>
const STORAGE_KEY = 'timekeeper-watches';
let state = { watches: [], activeId: null };
let loaded = false;
let saveStatus = '';

function uid(){ return 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

async function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state.watches = parsed.watches || [];
      state.activeId = parsed.activeId || (state.watches[0] ? state.watches[0].id : null);
    }
  }catch(e){
    // storage unavailable or corrupted — start empty
  }
  loaded = true;
  render();
}

async function saveState(){
  try{
    saveStatus = 'saving';
    render();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    saveStatus = 'saved';
  }catch(e){
    saveStatus = 'error';
  }
  render();
}

function exportData(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `timekeeper-backup.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  lastExportAt = new Date();
  render();
}

function importData(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed.watches) throw new Error('bad format');
      state.watches = parsed.watches;
      state.activeId = parsed.activeId || (state.watches[0] ? state.watches[0].id : null);
      saveState();
    }catch(e){
      alert("Couldn't read that file — make sure it's a Timekeeper backup JSON.");
    }
  };
  reader.readAsText(file);
}

function activeWatch(){
  return state.watches.find(w => w.id === state.activeId) || null;
}

function daysBetween(d1, d2){
  const a = new Date(d1 + 'T00:00:00');
  const b = new Date(d2 + 'T00:00:00');
  return Math.round((b - a) / 86400000);
}

function fmtRate(r){
  const sign = r > 0 ? '+' : '';
  return sign + r.toFixed(1);
}

function computeReadingRates(watch){
  // readings sorted by date, each has {date, offset, note, isReset}
  // rate for reading i = (offset_i - offset_{i-1}) / days_between
  // a reset point (post-service regulation) starts a fresh baseline, like i===0
  const readings = [...watch.readings].sort((a,b)=> a.date.localeCompare(b.date));
  return readings.map((r, i) => {
    if(i === 0 || r.isReset) return {...r, rate:null, days:null};
    const prev = readings[i-1];
    const days = daysBetween(prev.date, r.date);
    const rate = days > 0 ? (r.offset - prev.offset) / days : null;
    return {...r, rate, days};
  });
}

function overallStats(watch){
  const readings = [...watch.readings].sort((a,b)=> a.date.localeCompare(b.date));
  if(readings.length === 0) return null;
  let lastResetIdx = -1;
  readings.forEach((r,i) => { if(r.isReset) lastResetIdx = i; });
  const segment = lastResetIdx >= 0 ? readings.slice(lastResetIdx) : readings;
  if(segment.length < 2) return null;
  const first = segment[0];
  const last = segment[segment.length-1];
  const days = daysBetween(first.date, last.date);
  if(days <= 0) return null;
  const avgRate = (last.offset - first.offset) / days;
  return { avgRate, days, count: segment.length, sinceReset: lastResetIdx >= 0 };
}

function addWatch(name){
  const w = { id: uid(), name: name.trim(), readings: [] };
  state.watches.push(w);
  state.activeId = w.id;
  saveState();
}

function addDemoWatch(){
  const names = ['Demo Chronometer', 'Demo Diver', 'Test Watch'];
  const name = names[Math.floor(Math.random()*names.length)] + ' ' + Math.floor(Math.random()*90+10);
  const dailyRate = Math.round((Math.random()*6 - 1.5) * 10) / 10; // roughly -1.5 to +4.5 s/day
  const w = { id: uid(), name, readings: [] };
  let offset = 0;
  const start = new Date();
  start.setDate(start.getDate() - 32);
  let dayCursor = 0;
  const gaps = [0, 3, 4, 5, 4, 6, 5, 5];
  gaps.forEach((gap, i) => {
    dayCursor += gap;
    if(i > 0){
      offset += dailyRate * gap + (Math.random()*2 - 1);
    }
    const d = new Date(start);
    d.setDate(d.getDate() + dayCursor);
    w.readings.push({
      id: uid(),
      date: d.toISOString().slice(0,10),
      offset: Math.round(offset),
      note: i === 0 ? 'set to reference' : ''
    });
  });
  state.watches.push(w);
  state.activeId = w.id;
  saveState();
}

function addReading(watchId, date, offset, note){
  const w = state.watches.find(x => x.id === watchId);
  if(!w) return;
  w.readings.push({ id: uid(), date, offset: Number(offset), note: (note||'').trim() });
  saveState();
}

function ensureReadingIds(watch){
  watch.readings.forEach(r => { if(!r.id) r.id = uid(); });
}

function saveEditReading(watchId, id){
  const dateEl = document.getElementById('editDate_'+id);
  const offsetEl = document.getElementById('editOffset_'+id);
  const noteEl = document.getElementById('editNote_'+id);
  const resetEl = document.getElementById('editReset_'+id);
  if(!dateEl || !offsetEl || !dateEl.value || offsetEl.value === '') return;
  const w = state.watches.find(x => x.id === watchId);
  if(!w) return;
  const r = w.readings.find(x => x.id === id);
  if(!r) return;
  r.date = dateEl.value;
  r.offset = Number(offsetEl.value);
  r.note = (noteEl ? noteEl.value : '').trim();
  if(resetEl && resetEl.checked) r.isReset = true;
  else delete r.isReset;
  editingReadingId = null;
  saveState();
}

function deleteReading(watchId, id){
  const w = state.watches.find(x => x.id === watchId);
  if(!w) return;
  w.readings = w.readings.filter(x => x.id !== id);
  editingReadingId = null;
  saveState();
}

function saveRenameWatch(id){
  const inp = document.getElementById('renameInput');
  renamingWatchId = null;
  if(!inp || !inp.value.trim()){ render(); return; }
  const w = state.watches.find(x => x.id === id);
  if(w) w.name = inp.value.trim();
  saveState();
}

function deleteWatch(watchId){
  state.watches = state.watches.filter(w => w.id !== watchId);
  if(state.activeId === watchId){
    state.activeId = state.watches[0] ? state.watches[0].id : null;
  }
  saveState();
}

function buildLineChart(items, opts){
  if(items.length === 0) return `<div class="empty-note">${opts.emptyMsg}</div>`;
  const pxPerPoint = 46 * chartZoom;
  const h = 160, padL = 34, padR = 16, padT = 10, padB = 18;
  const plotW = Math.max(240, (items.length - 1) * pxPerPoint);
  const w = padL + padR + plotW;
  const values = items.map(it => it.value);
  let min = Math.min(...values, 0);
  let max = Math.max(...values, 0);
  if(min === max){ min -= 1; max += 1; }
  const range = max - min;
  const plotH = h - padT - padB;
  const stepX = items.length > 1 ? plotW / (items.length - 1) : 0;
  const xAt = i => padL + i * stepX;
  const yAt = v => padT + (1 - (v - min) / range) * plotH;
  const zeroY = yAt(0);
  const pts = items.map((it,i) => [xAt(i), yAt(it.value)]);
  const path = pts.map((p,i)=> (i===0?'M':'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');

  const ticks = [max, (max+min)/2, min];
  const gridlines = ticks.map(t => {
    const y = yAt(t);
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w-padR}" y2="${y.toFixed(1)}" stroke="rgba(255,255,255,0.08)" stroke-width="1" />`;
  }).join('');

  const xLabelsSvg = items.map((it,i) => {
    return `<text x="${xAt(i).toFixed(1)}" y="${h-6}" text-anchor="middle" font-size="9" font-family="'Inter',sans-serif" fill="#A1A1AA">${formatShortDate(it.date)}</text>`;
  }).join('');

  const selIdx = opts.selectedIndex;
  const dotsSvg = pts.map((p,i) => {
    const positive = items[i].value >= 0;
    const color = positive ? '#34D399' : '#F87171';
    const isSel = selIdx === i;
    const isReset = !!items[i].isReset;
    const ring = isSel ? `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="7" fill="none" stroke="${color}" stroke-width="1.5" />` : '';
    const resetMarker = isReset ? `<line x1="${p[0].toFixed(1)}" y1="${padT}" x2="${p[0].toFixed(1)}" y2="${h-padB}" stroke="#9C9AB5" stroke-width="1" stroke-dasharray="2,2" /><text x="${p[0].toFixed(1)}" y="${padT-4}" text-anchor="middle" font-size="8" font-family="'Inter',sans-serif" fill="#9C9AB5">svc</text>` : '';
    const dotColor = isReset ? '#9C9AB5' : color;
    return `<g class="chart-dot" data-chart="${opts.chartKey}" data-idx="${i}">
      ${resetMarker}
      <circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="11" fill="transparent" />
      ${ring}
      <circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${isSel?4.5:3.5}" fill="${dotColor}" />
    </g>`;
  }).join('');

  const svg = `<svg class="chart" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    ${gridlines}
    <line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${w-padR}" y2="${zeroY.toFixed(1)}" stroke="rgba(255,255,255,0.18)" stroke-width="1" stroke-dasharray="3,3" />
    <path d="${path}" fill="none" stroke="${opts.lineColor}" stroke-width="2" />
    ${dotsSvg}
    ${xLabelsSvg}
  </svg>`;

  const yAxisTicksHtml = ticks.map(t => {
    const y = yAt(t);
    return `<div class="yaxis-tick" style="top:${y.toFixed(1)}px">${opts.formatTick(t)}</div>`;
  }).join('');
  const yAxisHtml = `<div class="chart-yaxis" style="width:${padL}px;height:${h}px">${yAxisTicksHtml}</div>`;

  let tooltipHtml = '';
  if(selIdx !== null && items[selIdx]){
    const it = items[selIdx];
    tooltipHtml = `<span class="chart-tooltip">${formatShortDate(it.date)} · ${opts.formatTooltip(it.value)}</span>`;
  }

  const dateLabel = items.length > 1
    ? `${formatShortDate(items[0].date)} – ${formatShortDate(items[items.length-1].date)}`
    : formatShortDate(items[0].date);
  const meta = `<span class="chart-meta">${dateLabel} · ${opts.formatTick(min)} to ${opts.formatTick(max)}</span>`;
  const bottomRowHtml = `<div class="chart-bottom-row">${tooltipHtml}${meta}</div>`;
  const containerHtml = `<div class="chart-container">
    ${yAxisHtml}
    <div class="chart-scroll" id="${opts.chartKey}ChartScroll">${svg}</div>
  </div>
  <div class="custom-scrollbar-track" id="${opts.chartKey}ChartScrollTrack"><div class="custom-scrollbar-thumb horizontal" id="${opts.chartKey}ChartScrollThumb"></div></div>`;
  return containerHtml + bottomRowHtml;
}

function buildOffsetChart(sortedReadings, selectedIndex){
  const items = sortedReadings.map(r => ({date: r.date, value: r.offset, isReset: !!r.isReset}));
  return buildLineChart(items, {
    chartKey: 'offset',
    lineColor: '#6B6B8C',
    selectedIndex,
    emptyMsg: 'Log a reading to see it plotted here.',
    formatTick: v => `${Math.round(v)}s`,
    formatTooltip: v => `${v>0?'+':''}${Math.round(v)}s`
  });
}

function buildChart(ratedReadings, selectedIndex){
  const items = ratedReadings.map(r => ({date: r.date, value: r.rate === null ? 0 : r.rate, isReset: !!r.isReset}));
  return buildLineChart(items, {
    chartKey: 'drift',
    lineColor: '#6B6B8C',
    selectedIndex,
    emptyMsg: 'Log a second reading to see a trend line.',
    formatTick: v => `${v.toFixed(1)} s/day`,
    formatTooltip: v => `${v>0?'+':''}${v.toFixed(1)} s/day`
  });
}

function makeThumbDraggable(thumbId, trackId, scrollId, axis){
  const thumb = document.getElementById(thumbId);
  const track = document.getElementById(trackId);
  const scrollEl = document.getElementById(scrollId);
  if(!thumb || !track || !scrollEl) return;
  thumb.onpointerdown = (e) => {
    e.preventDefault();
    e.stopPropagation();
    const startPos = axis === 'x' ? e.clientX : e.clientY;
    const startScroll = axis === 'x' ? scrollEl.scrollLeft : scrollEl.scrollTop;
    const trackSize = axis === 'x' ? track.clientWidth : track.clientHeight;
    const contentSize = axis === 'x' ? scrollEl.scrollWidth : scrollEl.scrollHeight;
    const visibleSize = axis === 'x' ? scrollEl.clientWidth : scrollEl.clientHeight;
    const maxScroll = contentSize - visibleSize;
    const thumbSize = axis === 'x' ? thumb.offsetWidth : thumb.offsetHeight;
    const trackRange = trackSize - thumbSize;
    function onMove(ev){
      const pos = axis === 'x' ? ev.clientX : ev.clientY;
      const delta = pos - startPos;
      const scrollDelta = trackRange > 0 ? (delta / trackRange) * maxScroll : 0;
      let newScroll = startScroll + scrollDelta;
      newScroll = Math.max(0, Math.min(maxScroll, newScroll));
      if(axis === 'x') scrollEl.scrollLeft = newScroll;
      else scrollEl.scrollTop = newScroll;
    }
    function onUp(){
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
    }
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  };
}

function updateChartScrollbar(key){
  const scrollEl = document.getElementById(key+'ChartScroll');
  const track = document.getElementById(key+'ChartScrollTrack');
  const thumb = document.getElementById(key+'ChartScrollThumb');
  if(!scrollEl || !track || !thumb) return;
  const trackW = track.clientWidth;
  const contentW = scrollEl.scrollWidth;
  const visibleW = scrollEl.clientWidth;
  if(contentW <= visibleW + 1){
    track.style.display = 'none';
    return;
  }
  track.style.display = 'block';
  const thumbW = Math.max(20, (visibleW / contentW) * trackW);
  const maxScroll = contentW - visibleW;
  const scrollFrac = maxScroll > 0 ? scrollEl.scrollLeft / maxScroll : 0;
  const thumbLeft = scrollFrac * (trackW - thumbW);
  thumb.style.width = thumbW + 'px';
  thumb.style.left = thumbLeft + 'px';
}

function updateHistoryScrollbar(){
  const scrollEl = document.getElementById('historyScroll');
  const track = document.getElementById('historyScrollTrack');
  const thumb = document.getElementById('historyScrollThumb');
  if(!scrollEl || !track || !thumb) return;
  const trackH = track.clientHeight;
  const contentH = scrollEl.scrollHeight;
  const visibleH = scrollEl.clientHeight;
  if(contentH <= visibleH + 1){
    track.style.display = 'none';
    return;
  }
  track.style.display = 'block';
  const thumbH = Math.max(20, (visibleH / contentH) * trackH);
  const maxScroll = contentH - visibleH;
  const scrollFrac = maxScroll > 0 ? scrollEl.scrollTop / maxScroll : 0;
  const thumbTop = scrollFrac * (trackH - thumbH);
  thumb.style.height = thumbH + 'px';
  thumb.style.top = thumbTop + 'px';
}

function buildAnalogClockFace(){
  const cx = 200, cy = 200, R = 180;
  let ticks = '';
  for(let i=0;i<60;i++){
    const angle = i * 6;
    const isHour = i % 5 === 0;
    const outer = R - 8;
    const inner = isHour ? outer - 18 : outer - 8;
    const rad = (angle - 90) * Math.PI / 180;
    const x1 = cx + outer*Math.cos(rad), y1 = cy + outer*Math.sin(rad);
    const x2 = cx + inner*Math.cos(rad), y2 = cy + inner*Math.sin(rad);
    ticks += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#18181B" stroke-width="${isHour?3:1}" stroke-opacity="${isHour?1:0.35}" />`;
  }
  let numerals = '';
  for(let n=1;n<=12;n++){
    const angle = n * 30;
    const rad = (angle - 90) * Math.PI / 180;
    const nr = R - 8 - 40;
    const x = cx + nr*Math.cos(rad), y = cy + nr*Math.sin(rad);
    numerals += `<text x="${x.toFixed(1)}" y="${(y+7).toFixed(1)}" text-anchor="middle" font-size="22" font-family="'Inter',sans-serif" font-weight="600" fill="#18181B">${n}</text>`;
  }
  return `
    <svg viewBox="0 0 400 400" width="400" height="400" class="analog-clock">
      <circle cx="${cx}" cy="${cy}" r="${R}" fill="#FFFFFF" stroke="#E0E0DE" stroke-width="2" />
      ${ticks}
      ${numerals}
      <line id="analogHourHand" x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy-90}" stroke="#18181B" stroke-width="8" stroke-linecap="round" />
      <line id="analogMinuteHand" x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy-130}" stroke="#18181B" stroke-width="5" stroke-linecap="round" />
      <line id="analogSecondHand" x1="${cx}" y1="${cy+20}" x2="${cx}" y2="${cy-150}" stroke="#B4432F" stroke-width="2" stroke-linecap="round" />
      <circle cx="${cx}" cy="${cy}" r="7" fill="#18181B" />
      <circle cx="${cx}" cy="${cy}" r="3" fill="#B4432F" />
    </svg>
  `;
}

const CLOCK_TICK_BPH = 28000; // beats per hour the analog second hand steps at

function updateAnalogClock(){
  const hourEl = document.getElementById('analogHourHand');
  if(!hourEl) return;
  const minuteEl = document.getElementById('analogMinuteHand');
  const secondEl = document.getElementById('analogSecondHand');
  const now = trueNow();
  const h = now.getHours() % 12, m = now.getMinutes(), s = now.getSeconds(), ms = now.getMilliseconds();

  const tickIntervalSec = 3600 / CLOCK_TICK_BPH;
  const rawSec = s + ms/1000;
  const steppedSec = Math.floor(rawSec / tickIntervalSec) * tickIntervalSec;

  const secAngle = steppedSec / 60 * 360;
  const minAngle = (m + s/60) / 60 * 360;
  const hourAngle = (h + m/60) / 12 * 360;
  hourEl.setAttribute('transform', `rotate(${hourAngle.toFixed(2)} 200 200)`);
  if(minuteEl) minuteEl.setAttribute('transform', `rotate(${minAngle.toFixed(2)} 200 200)`);
  if(secondEl) secondEl.setAttribute('transform', `rotate(${secAngle.toFixed(2)} 200 200)`);
}

function tgFormatStatsHtml(stats, isLive){
  const sign = stats.secPerDay >= 0 ? '+' : '';
  const snrLabel = stats.snrDb < 10 ? '(weak — get closer)' : stats.snrDb < 20 ? '(ok)' : '(good)';
  return `
    <div class="tg-stat-row"><span>Detected beat rate</span><b>${stats.bph} bph</b></div>
    <div class="tg-stat-row"><span>Rate</span><b style="color:${stats.secPerDay>=0?'#34D399':'#F87171'}">${sign}${stats.secPerDay.toFixed(1)} s/day</b></div>
    <div class="tg-stat-row"><span>Beat error</span><b>${stats.beatErrorMs.toFixed(1)} ms</b></div>
    <div class="tg-stat-row"><span>Signal strength</span><b>${stats.snrDb.toFixed(0)} dB ${snrLabel}</b></div>
    <p class="hint" style="margin-top:8px;">${isLive ? 'Still listening — this will stabilize as more ticks come in.' : "Amplitude in degrees isn't shown — that needs a calibrated contact mic. Signal strength above is a rough proxy only, not a true reading."}</p>
  `;
}

async function tgStart(){
  tgError = null;
  tgResults = null;
  let stream;
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation:false, noiseSuppression:false, autoGainControl:false, channelCount:1 }
    });
  }catch(e){
    tgError = "Couldn't access the microphone — check that this page has mic permission.";
    render();
    return;
  }
  tgStream = stream;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  tgAudioCtx = new Ctx();
  tgSampleRate = tgAudioCtx.sampleRate;
  const source = tgAudioCtx.createMediaStreamSource(stream);
  const hp = tgAudioCtx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 300;
  const lp = tgAudioCtx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 10000;
  const processor = tgAudioCtx.createScriptProcessor(1024, 1, 1);
  const silentGain = tgAudioCtx.createGain(); silentGain.gain.value = 0;
  source.connect(hp); hp.connect(lp); lp.connect(processor); processor.connect(silentGain); silentGain.connect(tgAudioCtx.destination);
  tgProcessor = processor;
  tgTotalSamples = 0;
  tgRefractorySample = -Infinity;
  tgNoiseFloor = 0.001;
  tgTickTimes = [];
  tgTickPeaks = [];
  tgStartWallClock = Date.now();
  processor.onaudioprocess = tgProcessAudio;
  tgListening = true;
  render();
  tgUpdateInterval = setInterval(tgRefreshLiveDisplay, 100);
}

function tgFlashDot(){
  const dot = document.getElementById('tgTickDot');
  if(!dot) return;
  dot.style.background = '#34D399';
  clearTimeout(tgFlashTimeout);
  tgFlashTimeout = setTimeout(()=>{ dot.style.background = ''; }, 90);
}

function tgProcessAudio(e){
  const input = e.inputBuffer.getChannelData(0);
  let bufferPeak = 0;
  let anyTick = false;
  const factor = 1.8 / tgSensitivity;
  const absFloor = 0.0018 / tgSensitivity;
  const threshold = Math.max(tgNoiseFloor * factor, absFloor);
  for(let i=0;i<input.length;i++){
    const a = Math.abs(input[i]);
    if(a > bufferPeak) bufferPeak = a;
    const gIdx = tgTotalSamples + i;
    if(gIdx >= tgRefractorySample && a > threshold){
      tgTickTimes.push(gIdx / tgSampleRate);
      tgTickPeaks.push(a);
      tgRefractorySample = gIdx + Math.floor(0.025 * tgSampleRate);
      anyTick = true;
      tgFlashDot();
    }
  }
  tgLastBufferPeak = bufferPeak;
  if(!anyTick){
    tgNoiseFloor = tgNoiseFloor * 0.98 + bufferPeak * 0.02;
  }
  tgTotalSamples += input.length;
}

function tgTeardownAudio(){
  if(tgUpdateInterval){ clearInterval(tgUpdateInterval); tgUpdateInterval = null; }
  if(tgProcessor){ tgProcessor.onaudioprocess = null; try{ tgProcessor.disconnect(); }catch(e){} tgProcessor = null; }
  if(tgAudioCtx){ try{ tgAudioCtx.close(); }catch(e){} tgAudioCtx = null; }
  if(tgStream){ tgStream.getTracks().forEach(t => t.stop()); tgStream = null; }
}

function tgStop(){
  tgTeardownAudio();
  tgListening = false;
  tgResults = tgComputeStats();
  render();
}

function tgAbort(){
  tgTeardownAudio();
  tgListening = false;
  tgResults = null;
}

function tgComputeStats(){
  if(tgTickTimes.length < 4) return null;
  const intervalsMs = [];
  for(let i=1;i<tgTickTimes.length;i++){ intervalsMs.push((tgTickTimes[i]-tgTickTimes[i-1]) * 1000); }
  const filtered = intervalsMs.filter(x => x >= 60 && x <= 400);
  if(filtered.length < 3) return null;
  const sorted = [...filtered].sort((a,b)=>a-b);
  const median = sorted[Math.floor(sorted.length/2)];
  const standardBph = [14400, 18000, 19800, 21600, 25200, 28800, 36000];
  let bestBph = standardBph[0], bestDiff = Infinity;
  standardBph.forEach(b => {
    const nominal = 3600000 / b;
    const diff = Math.abs(nominal - median);
    if(diff < bestDiff){ bestDiff = diff; bestBph = b; }
  });
  const nominalMs = 3600000 / bestBph;
  const mean = filtered.reduce((s,x)=>s+x,0) / filtered.length;
  const ratePpm = (nominalMs - mean) / nominalMs;
  const secPerDay = ratePpm * 86400;
  const groupA = [], groupB = [];
  filtered.forEach((v,i) => (i%2===0 ? groupA : groupB).push(v));
  const avgA = groupA.reduce((s,x)=>s+x,0) / (groupA.length || 1);
  const avgB = groupB.reduce((s,x)=>s+x,0) / (groupB.length || 1);
  const beatErrorMs = Math.abs(avgA - avgB);
  const avgPeak = tgTickPeaks.reduce((s,x)=>s+x,0) / (tgTickPeaks.length || 1);
  const snrDb = 20 * Math.log10(Math.max(avgPeak,1e-6) / Math.max(tgNoiseFloor,1e-6));
  return { bph: bestBph, secPerDay, beatErrorMs, snrDb, tickCount: tgTickTimes.length };
}

function tgRefreshLiveDisplay(){
  const elCount = document.getElementById('tgTickCount');
  if(!elCount) return;
  elCount.textContent = tgTickTimes.length;
  const elElapsed = document.getElementById('tgElapsed');
  if(elElapsed && tgStartWallClock){
    elElapsed.textContent = Math.floor((Date.now()-tgStartWallClock)/1000) + 's';
  }

  // live mic level meter — scaled against a fixed reference (0.3) so a
  // moderate real-world tick shows as a clearly visible spike, not a
  // barely-there sliver
  const elLevelFill = document.getElementById('tgLevelFill');
  const elLevelPct = document.getElementById('tgLevelPct');
  if(elLevelFill){
    const pct = Math.min(100, Math.round((tgLastBufferPeak / 0.3) * 100));
    elLevelFill.style.width = pct + '%';
    elLevelFill.style.background = pct > 70 ? 'var(--good)' : pct > 15 ? 'var(--accent)' : 'var(--grey)';
    if(elLevelPct) elLevelPct.textContent = pct + '%';
  }
  const elThreshold = document.getElementById('tgLevelThreshold');
  if(elThreshold){
    const factor = 1.8 / tgSensitivity;
    const absFloor = 0.0018 / tgSensitivity;
    const threshold = Math.max(tgNoiseFloor * factor, absFloor);
    const thresholdPct = Math.min(100, Math.round((threshold / 0.3) * 100));
    elThreshold.style.left = thresholdPct + '%';
  }

  if(tgTickTimes.length >= 10){
    const stats = tgComputeStats();
    const elLive = document.getElementById('tgLiveStats');
    if(stats && elLive){
      elLive.innerHTML = tgFormatStatsHtml(stats, true);
    }
  }
}

function attachHandlers(watch){
  document.querySelectorAll('[data-action="select"]').forEach(el=>{
    el.onclick = () => { if(tgListening) tgAbort(); state.activeId = el.dataset.id; newWatchMode=false; selectedOffsetIdx=null; selectedDriftIdx=null; offsetScrollLeft=null; driftScrollLeft=null; editingReadingId=null; renamingWatchId=null; render(); };
  });
  const newBtn = document.querySelector('[data-action="newmode"]');
  if(newBtn) newBtn.onclick = () => { if(tgListening) tgAbort(); state.activeId = null; render(); setTimeout(()=>{ const inp=document.getElementById('newWatchName'); if(inp) inp.focus(); }, 0); };
  const demoBtn = document.querySelector('[data-action="adddemo"]');
  if(demoBtn) demoBtn.onclick = () => { if(tgListening) tgAbort(); addDemoWatch(); };
  const addWatchBtn = document.querySelector('[data-action="addwatch"]');
  if(addWatchBtn) addWatchBtn.onclick = () => {
    const inp = document.getElementById('newWatchName');
    if(inp && inp.value.trim()) addWatch(inp.value);
  };
  const nameInput = document.getElementById('newWatchName');
  if(nameInput) nameInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); if(nameInput.value.trim()) addWatch(nameInput.value); }});

  const form = document.getElementById('readingForm');
  if(form) form.onsubmit = (e) => {
    e.preventDefault();
    const date = document.getElementById('rDate').value;
    const offset = document.getElementById('rOffset').value;
    const note = document.getElementById('rNote').value;
    if(!date || offset === '') return;
    addReading(watch.id, date, offset, note);
  };

  const delBtn = document.querySelector('[data-action="deletewatch"]');
  if(delBtn) delBtn.onclick = () => {
    if(confirm(`Delete "${watch.name}" and all its readings? This can't be undone.`)){
      deleteWatch(watch.id);
    }
  };

  const toggleBtn = document.querySelector('[data-action="manualmode"]');
  if(toggleBtn) toggleBtn.onclick = () => { manualMode = true; quickCaptured = null; render(); };

  const quickModeBtn = document.querySelector('[data-action="quickmode"]');
  if(quickModeBtn) quickModeBtn.onclick = () => { manualMode = false; quickCaptured = null; render(); };

  document.querySelectorAll('[data-action="zoomin"]').forEach(el=>{
    el.onclick = () => {
      chartZoom = Math.min(3, Math.round((chartZoom + 0.4) * 10) / 10);
      offsetScrollLeft = null; driftScrollLeft = null;
      render();
    };
  });
  document.querySelectorAll('[data-action="zoomout"]').forEach(el=>{
    el.onclick = () => {
      chartZoom = Math.max(0.5, Math.round((chartZoom - 0.4) * 10) / 10);
      offsetScrollLeft = null; driftScrollLeft = null;
      render();
    };
  });

  const tgStartBtn = document.querySelector('[data-action="tgstart"]');
  if(tgStartBtn) tgStartBtn.onclick = () => tgStart();
  const tgStopBtn = document.querySelector('[data-action="tgstop"]');
  if(tgStopBtn) tgStopBtn.onclick = () => tgStop();
  const tgSensSlider = document.getElementById('tgSensSlider');
  if(tgSensSlider){
    tgSensSlider.oninput = (e) => {
      tgSensitivity = parseFloat(e.target.value);
      const label = document.getElementById('tgSensValue');
      if(label) label.textContent = tgSensitivity.toFixed(1) + '×';
    };
  }

  document.querySelectorAll('[data-action="edithistory"]').forEach(el=>{
    el.onclick = () => { editingReadingId = el.dataset.id; render(); };
  });
  const cancelEditBtn = document.querySelector('[data-action="canceledit"]');
  if(cancelEditBtn) cancelEditBtn.onclick = () => { editingReadingId = null; render(); };
  const saveEditBtn = document.querySelector('[data-action="saveedit"]');
  if(saveEditBtn) saveEditBtn.onclick = () => saveEditReading(watch.id, saveEditBtn.dataset.id);
  const deleteReadingBtn = document.querySelector('[data-action="deletereading"]');
  if(deleteReadingBtn) deleteReadingBtn.onclick = () => {
    if(confirm('Delete this reading?')) deleteReading(watch.id, deleteReadingBtn.dataset.id);
    else { editingReadingId = null; render(); }
  };

  const renameBtn = document.querySelector('[data-action="renamewatch"]');
  if(renameBtn) renameBtn.onclick = () => {
    renamingWatchId = renameBtn.dataset.id;
    render();
    setTimeout(()=>{ const inp=document.getElementById('renameInput'); if(inp){ inp.focus(); inp.select(); } }, 0);
  };
  const saveRenameBtn = document.querySelector('[data-action="saverename"]');
  if(saveRenameBtn) saveRenameBtn.onclick = () => saveRenameWatch(watch.id);
  const renameInputEl = document.getElementById('renameInput');
  if(renameInputEl) renameInputEl.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); saveRenameWatch(watch.id); }});

  document.querySelectorAll('.chart-dot').forEach(el=>{
    el.onclick = () => {
      const idx = Number(el.dataset.idx);
      if(el.dataset.chart === 'offset'){
        selectedOffsetIdx = (selectedOffsetIdx === idx) ? null : idx;
      } else {
        selectedDriftIdx = (selectedDriftIdx === idx) ? null : idx;
      }
      render();
    };
  });

  document.querySelectorAll('[data-action="quicksec"]').forEach(el=>{
    el.onclick = () => {
      quickCaptured = { at: trueNow(), second: Number(el.dataset.sec) };
      render();
    };
  });

  const quickCancelBtn = document.querySelector('[data-action="quickcancel"]');
  if(quickCancelBtn) quickCancelBtn.onclick = () => { quickCaptured = null; render(); };

  const quickConfirmBtn = document.querySelector('[data-action="quickconfirm"]');
  if(quickConfirmBtn) quickConfirmBtn.onclick = () => {
    if(!quickCaptured) return;
    const c = quickCaptured.at;
    const qH = document.getElementById('qH');
    const qM = document.getElementById('qM');
    const qNote = document.getElementById('qNote');
    const h = qH.value === '' ? c.getHours() : Number(qH.value);
    const m = qM.value === '' ? c.getMinutes() : Number(qM.value);
    const note = qNote ? qNote.value : '';
    const phoneSec = c.getHours()*3600 + c.getMinutes()*60 + c.getSeconds();
    const watchSec = h*3600 + m*60 + quickCaptured.second;
    let diff = watchSec - phoneSec;
    while(diff > 43200) diff -= 86400;
    while(diff <= -43200) diff += 86400;
    const date = c.toISOString().slice(0,10);
    quickCaptured = null;
    addReading(watch.id, date, diff, note);
  };

  const exportBtn = document.querySelector('[data-action="export"]');
  if(exportBtn) exportBtn.onclick = () => exportData();

  const importInput = document.getElementById('importFile');
  if(importInput) importInput.onchange = (e) => {
    const file = e.target.files[0];
    if(file) importData(file);
  };
}

let timeOffsetMs = 0;
let timeSyncStatus = 'pending'; // 'pending' | 'synced' | 'failed'

function trueNow(){
  return new Date(Date.now() + timeOffsetMs);
}

async function syncTrueTime(){
  const labelEl = document.getElementById('masterClockLabel');
  if(labelEl) labelEl.textContent = 'reference time · syncing…';
  try{
    const t0 = Date.now();
    const res = await fetch('https://worldtimeapi.org/api/timezone/Etc/UTC', { cache: 'no-store' });
    const t1 = Date.now();
    if(!res.ok) throw new Error('bad response');
    const data = await res.json();
    const serverMs = Date.parse(data.datetime);
    if(isNaN(serverMs)) throw new Error('bad datetime');
    const roundTrip = t1 - t0;
    const estimatedServerAtT1 = serverMs + roundTrip/2;
    timeOffsetMs = estimatedServerAtT1 - t1;
    timeSyncStatus = 'synced';
  }catch(e){
    timeOffsetMs = 0;
    timeSyncStatus = 'failed';
  }
  if(labelEl){
    labelEl.textContent = timeSyncStatus === 'synced'
      ? 'reference time · synced to atomic clock'
      : 'reference time · this phone (sync failed, tap to retry)';
  }
}

loadState();
syncTrueTime();
setInterval(syncTrueTime, 5 * 60 * 1000);

let clockTickEnabled = false;
let clockAudioCtx = null;
let clockTickTimeout = null;
let tickTockToggle = true;

function playTickSound(){
  if(!clockAudioCtx) clockAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const ctx = clockAudioCtx;
  const t = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.frequency.value = tickTockToggle ? 1800 : 1400;
  tickTockToggle = !tickTockToggle;
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(0.22, t + 0.005);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(t);
  osc.stop(t + 0.05);
}

function scheduleNextTick(){
  if(!clockTickEnabled) return;
  const now = trueNow();
  const msToNextSecond = 1000 - now.getMilliseconds();
  clockTickTimeout = setTimeout(() => {
    playTickSound();
    scheduleNextTick();
  }, msToNextSecond);
}

const clockBoxEl = document.getElementById('masterClockBox');
if(clockBoxEl){
  clockBoxEl.onclick = () => {
    clockTickEnabled = !clockTickEnabled;
    clockBoxEl.classList.toggle('ticking', clockTickEnabled);
    if(clockTickEnabled){
      if(!clockAudioCtx) clockAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(clockAudioCtx.state === 'suspended') clockAudioCtx.resume();
      scheduleNextTick();
    } else if(clockTickTimeout){
      clearTimeout(clockTickTimeout);
      clockTickTimeout = null;
    }
  };
}

setInterval(() => {
  const el = document.getElementById('masterClock');
  if(el){
    const n = trueNow();
    el.textContent = pad2(n.getHours()) + ':' + pad2(n.getMinutes()) + ':' + pad2(n.getSeconds());
  }
  updateAnalogClock();
}, 60);

document.querySelectorAll('.bottom-tab').forEach(btn => {
  btn.onclick = () => {
    if(tgListening && btn.dataset.tab !== 'timegrapher') tgAbort();
    activeTab = btn.dataset.tab;
    document.querySelectorAll('.bottom-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    editingReadingId = null;
    renamingWatchId = null;
    render();
  };
});

function updateClockCollapse(){
  // kept as a no-op shim so existing render() calls to it don't error
}

const clockSentinelEl = document.getElementById('clockSentinel');
const masterClockBoxEl = document.getElementById('masterClockBox');
const CLOCK_COLLAPSE_RANGE = 70; // px of scroll over which it fully collapses

// Continuous scroll-linked collapse: every animation frame, measure exactly
// how far past the sentinel we've scrolled and set that as a 0–1 progress
// value via a CSS custom property, which calc() uses to size the box.
// This tracks the finger 1:1 (like iOS/Android collapsing headers) instead
// of snapping between two fixed states, so there's nothing to look jumpy.
function clockCollapseLoop(){
  if(clockSentinelEl && masterClockBoxEl){
    const rect = clockSentinelEl.getBoundingClientRect();
    const distancePast = Math.max(0, -rect.bottom);
    const t = Math.min(1, distancePast / CLOCK_COLLAPSE_RANGE);
    masterClockBoxEl.style.setProperty('--t', t.toFixed(3));
  }
  requestAnimationFrame(clockCollapseLoop);
}
requestAnimationFrame(clockCollapseLoop);
