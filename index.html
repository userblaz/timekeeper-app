<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<script>
  // Applied as early as possible, before the stylesheet paints anything —
  // otherwise a light-theme user would see a flash of dark on every load
  // before this could switch it. profile.js is where the actual toggle UI
  // lives; this is just the earliest possible read of the same saved value.
  //
  // First visit (nothing saved yet): follows the OS/browser's own
  // dark/light setting. The moment someone uses the toggle, that choice is
  // saved and takes over permanently — the system setting is only ever
  // consulted before an explicit choice exists.
  try{
    var t = localStorage.getItem('timekeeper-theme');
    if(t === null){
      t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    }
    if(t === 'light') document.documentElement.setAttribute('data-theme', 'light');
  }catch(e){}
</script>

<body>
<div id="authScreen" style="display:none;">
  <div class="auth-box">
    <h1>Timekeeper</h1>
    <p>Sign in with your email to continue</p>
    <div class="field">
      <label for="authEmail">Email</label>
      <input type="email" id="authEmail" placeholder="you@example.com" autocomplete="email" />
    </div>
    <div class="field" id="authPasswordField">
      <label for="authPassword">Password</label>
      <input type="password" id="authPassword" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <div class="field" id="authCodeField" style="display:none;">
      <label for="authCode">6-digit code</label>
      <input type="text" id="authCode" placeholder="123456" inputmode="numeric" autocomplete="one-time-code" maxlength="6" />
    </div>
    <button id="authSendBtn" class="btn-primary">Sign in</button>
    <button type="button" id="authToggleSignupBtn" class="auth-toggle-link">New here? Create an account</button>
    <button type="button" id="authToggleCodeBtn" class="auth-toggle-link">Sign in with a code instead</button>
    <button type="button" id="authBackBtn" class="auth-toggle-link" style="display:none;">Back to password sign in</button>
    <div id="authStatus" class="auth-status"></div>
  </div>
</div>
<div class="app" id="app" style="display:none;">
  <div class="app-title">
    <h1>Timekeeper</h1>
  </div>
  <div id="clockSentinel" style="height:1px;"></div>
  <div id="stickyHeader">
    <div class="master-clock-box" id="masterClockBox">
      <div class="master-clock-label" id="masterClockLabel">reference time · syncing…</div>
      <div class="master-clock" id="masterClock">--:--:--</div>
    </div>
    <div id="tabsSlot"></div>
  </div>
  <div id="root">Loading…</div>
</div>
